publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP / saqlash
  http: ^1.2.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2

  # Xarita (OSM — bepul, kalit talab qilinmaydi)
